[project]
name = "vulntriage"
version = "1.0.0"
description = "Risk-based vulnerability triage: a deterministic, explainable model scores each finding from its CVSS base, exploit maturity, and the exposure, criticality and data-sensitivity of the affected asset, assigns a P1-P4 priority and SLA, and attaches an LLM-assisted remediation note with an offline fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "scikit-learn>=1.5",
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
vulntriage = "vulntriage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vulntriage*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
